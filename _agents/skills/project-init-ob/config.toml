# project-init-ob 配置
# Agent 读取此文件确定项目管理文件的存放位置

[vault]
# Obsidian vault 的绝对路径
path = "D:/Cortex"
# vault 内项目管理文件的根目录
projects_dir = "Projects"

[project]
# 当前项目名（对应 vault 内的子目录）
name = "RLLAB"
# 完整路径 = vault.path / vault.projects_dir / project.name
# 即: D:/Cortex/Projects/RLLAB/

[kanban]
# Kanban 插件模式: basic | board
plugin_mode = "board"
# 列宽（像素）
lane_width = 280
# 显示 checkbox
show_checkboxes = true
# 固定列名（有序）
columns = ["Backlog", "In Progress", "Review", "Done"]

[git]
# update 子动作：仅提醒用户 commit（不自动执行）
auto_commit_on_update = false
# clean 子动作：先自动 commit 快照再清理
auto_commit_on_clean = true
pre_clean_message = "pre-clean snapshot"
