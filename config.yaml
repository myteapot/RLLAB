# ========================================
#  Auto-Evolving Grasp — Main Configuration
# ========================================

# --- LLM Settings ---
llm:
  base_url: "https://right.codes/codex/v1"   # Change to your free API endpoint
  api_key: "sk-1f5856a2b72248499dbf0fa6154e6844"              # Or set env var OPENAI_API_KEY
  model: "gpt-5.2"                          # Model name on your endpoint
  temperature: 0.7
  max_tokens: 4096
  retry_attempts: 3
  retry_delay: 2.0                         # seconds

# --- Environment Settings ---
environment:
  # Robosuite config
  robot: "Panda"                           # Panda for MVP, extensible later
  task: "Lift"                             # Robosuite task name
  horizon: 200                             # Max steps per episode
  reward_shaping: false                    # Use LLM reward, not built-in
  has_renderer: false                      # No GUI rendering during training
  has_offscreen_renderer: false
  use_camera_obs: false                    # Joint-level obs only for MVP
  control_freq: 20                         # Control frequency (Hz)

# --- Training Settings ---
training:
  algorithm: "PPO"
  total_timesteps: 500_000                 # Steps per candidate
  learning_rate: 0.0003
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  n_envs: 4                               # Parallel envs (CPU cores)
  seed: 42

# --- Evaluation Settings ---
evaluation:
  n_episodes: 50                           # Episodes per evaluation
  metrics_weights:
    success_rate: 0.40
    stability: 0.25
    efficiency: 0.20
    smoothness: 0.15

# --- Evolution Settings ---
evolution:
  max_generations: 100
  candidates_per_generation: 4             # Reward functions per generation
  elite_count: 2                           # Keep top-K for mutation
  convergence_patience: 10                 # Stop if no improvement for N gens

# --- Checkpoint Settings ---
checkpoint:
  base_dir: "checkpoints"
  top_k: 5                                # Keep top-K checkpoints per task
  save_every_gen: true                     # Save config snapshot every generation

# --- Paths ---
paths:
  rewards_dir: "rewards"
  configs_dir: "configs/snapshots"
  reports_dir: "reports"
  prompts_dir: "prompts"
