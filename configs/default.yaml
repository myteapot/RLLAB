# ========================================
#  Auto-Evolving Grasp — Default Config
# ========================================

# Secrets should come from environment variables:
# - OPENAI_API_KEY
# - OPENAI_BASE_URL

llm:
  base_url: null
  api_key: null
  model: "gpt-5.2"
  temperature: 0.7
  max_tokens: 4096
  retry_attempts: 3
  retry_delay: 2.0

environment:
  robot: "Panda"
  task: "Lift"
  horizon: 200
  reward_shaping: false
  has_renderer: false
  has_offscreen_renderer: false
  use_camera_obs: false
  control_freq: 20

training:
  algorithm: "PPO"
  total_timesteps: 500_000
  learning_rate: 0.0003
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  n_envs: 4
  device: "cpu"
  seed: 42

evaluation:
  n_episodes: 50
  metrics_weights:
    success_rate: 0.40
    stability: 0.25
    efficiency: 0.20
    smoothness: 0.15

evolution:
  max_generations: 100
  candidates_per_generation: 4
  elite_count: 2
  convergence_patience: 10
  two_stage: false
  screen_timesteps: 2000
  screen_candidates: 12
  screen_top_k: 3

checkpoint:
  base_dir: "scratch/checkpoints"
  top_k: 5
  save_every_gen: true

paths:
  rewards_dir: "scratch/rewards"
  configs_dir: "scratch/config_snapshots"
  reports_dir: "scratch/reports"
  prompts_dir: "prompts"
  logs_dir: "scratch/logs"
